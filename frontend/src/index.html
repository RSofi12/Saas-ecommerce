<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FashionStore — SaaS Multitenant</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/logo-fashionstore.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo-fashionstore.png?v=2">
  <link rel="apple-touch-icon" href="/assets/logo-fashionstore.png?v=2">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2">

  <meta name="theme-color" content="#0f172a">
  <link rel="preload" href="runtime-config.js" as="script">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

</head>
<body class="font-sans antialiased text-slate-800 bg-slate-50/50">
  <app-root></app-root>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('[PWA] Error registrando service worker:', err);
        });
      });
    }
  </script>
</body>
</html>
